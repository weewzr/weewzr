# Build the Astro site and publish it to GitHub Pages.
# One-time repository setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A pull request runs the build job only (type check, build, link and structure checks).
  # Nothing is deployed from a pull request: the deploy job below is limited to main.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which installs npm packages) only reads the repository.
permissions:
  contents: read

# Let a running deployment finish; the newest queued run replaces any older queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Astro 7 needs Node 22.23.4 or newer. check-latest makes setup-node fetch the newest
          # 22.x instead of reusing an older copy that may be preinstalled on the runner image.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build
        run: npm run build

      # Standard-library Python only. External URLs are not requested here.
      - name: Check links and page structure
        run: |
          python3 -I tools/check_links.py dist
          python3 -I tools/check_structure.py dist

      - name: Upload the site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
